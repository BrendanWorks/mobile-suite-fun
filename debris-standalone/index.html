<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="DEBRIS — a neon asteroids-style arcade shooter. Rotate, thrust, and shoot your way through waves of rocks and UFOs." />
    <title>DEBRIS</title>

    <!-- iOS ignores the web manifest for home-screen behavior, so these are
         set explicitly: an apple-touch-icon, and "capable" so launching from
         the home screen opens as a standalone app instead of in Safari. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DEBRIS" />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
